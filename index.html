<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eden - Digital Design & Management</title>
  <meta name="description"
    content="Eden is a digital design & management studio. Buy logos, posters, commercial designs, thumbnails and event banners — or hand over event planning and social media management. Three transparent tiers, instant AI help, live managers." />
  <meta name="theme-color" content="#f6f2ea" />

  <!-- OpenGraph -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Eden" />
  <meta property="og:title" content="Eden - Digital Design & Management" />
  <meta property="og:description"
    content="Logos, posters, thumbnails, banners, event planning & social media management — three honest tiers on everything, briefed in one form." />
  <meta property="og:image" content="/logo.svg" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Eden - Digital Design & Management" />
  <meta name="twitter:description"
    content="Handcrafted design and managed execution — with three transparent tiers on every service." />
  <meta name="twitter:image" content="/logo.svg" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Structured data: Organization (homepage) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Eden",
    "url": "/",
    "logo": "/logo.svg",
    "description": "Digital design & management studio selling one-off creative products and ongoing services.",
    "sameAs": []
  }
  </script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Eden",
    "url": "/"
  }
  </script>
</head>


<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
