<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!--
    Placeholder app icon — an abstract mark, no lettering. The live site swaps
    this for the uploaded logo in SettingsProvider, so it only shows before a
    logo exists.
  -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg' viewBox='0 0 96 96'%3E%3Crect width='96' height='96' rx='20' fill='%2314110f'/%3E%3Ccircle cx='48' cy='48' r='18' fill='none' stroke='%23f4efe6' stroke-width='7'/%3E%3C%2Fsvg%3E" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg' viewBox='0 0 96 96'%3E%3Crect width='96' height='96' rx='20' fill='%2314110f'/%3E%3Ccircle cx='48' cy='48' r='18' fill='none' stroke='%23f4efe6' stroke-width='7'/%3E%3C%2Fsvg%3E" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <!--
    Placeholder metadata only. The live site replaces the title, description and
    OpenGraph tags per route from the CMS (see src/lib/seo.ts), and uses the
    studio name set in Words & copy.
  -->
  <title>Digital design & management studio</title>
  <meta name="description"
    content="A digital design & management studio. Logos, posters, commercial designs, thumbnails and event banners — plus event planning and social media management. Three transparent tiers, instant AI help, live managers." />
  <meta name="keywords"
    content="logo design, poster design, commercial design, YouTube thumbnails, event banners, event planning, social media management, digital design studio, graphic design India" />
  <meta name="author" content="Studio" />
  <meta name="generator" content="Freebuff" />
  <meta name="theme-color" content="#f6f2ea" />
  <meta name="msapplication-TileColor" content="#f6f2ea" />
  <meta name="msapplication-config" content="/browserconfig.xml" />

  <!-- Google Search Console -->
  <meta name="google-site-verification" content="OzAqXrwD-LSgNIp9d9CDPaJ9V_r6hk2TCMGyaxHwWFg" />

  <!-- OpenGraph -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Studio" />
  <meta property="og:title" content="Digital design & management studio" />
  <meta property="og:description"
    content="Logos, posters, thumbnails, banners, event planning & social media management — three honest tiers on everything, briefed in one form." />
  <meta property="og:image" content="https://eden.design/og-image.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:locale" content="en_IN" />
  <meta property="og:url" content="https://eden.design/" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Digital design & management studio" />
  <meta name="twitter:description"
    content="Handcrafted design and managed execution — with three transparent tiers on every service." />
  <meta name="twitter:image" content="https://eden.design/og-image.jpg" />
  <meta name="twitter:site" content="@eden_design" />
  <meta name="twitter:creator" content="@eden_design" />

  <!-- Canonical -->
  <link rel="canonical" href="https://eden.design/" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Portfolio images are served from Unsplash's CDN -->
  <link rel="preconnect" href="https://images.unsplash.com" />

  <!-- Structured data: Organization (homepage) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Studio",
    "url": "https://eden.design/",
    "logo": "https://eden.design/logo.svg",
    "description": "Digital design & management studio selling one-off creative products and ongoing services.",
    "foundingDate": "2024",
    "sameAs": [
      "https://instagram.com/eden_design",
      "https://twitter.com/eden_design",
      "https://behance.net/eden_design",
      "https://linkedin.com/company/eden-design"
    ],
    "contactPoint": {
      "@type": "ContactPoint",
      "contactType": "customer service",
      "availableLanguage": "English"
    }
  }
  </script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Studio",
    "url": "https://eden.design/",
    "potentialAction": {
      "@type": "SearchAction",
      "target": {
        "@type": "EntryPoint",
        "urlTemplate": "https://eden.design/?q={search_term_string}"
      },
      "query-input": "required name=search_term_string"
    }
  }
  </script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "LocalBusiness",
    "name": "Studio",
    "description": "Digital design and management studio offering logo design, posters, thumbnails, event planning and social media management.",
    "url": "https://eden.design/",
    "telephone": "",
    "priceRange": "₹500 - ₹5000",
    "address": {
      "@type": "PostalAddress",
      "addressLocality": "India",
      "addressCountry": "IN"
    },
    "geo": {
      "@type": "GeoCoordinates",
      "latitude": 20.0,
      "longitude": 78.0
    }
  }
  </script>
</head>


<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
